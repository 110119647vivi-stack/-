<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8f3">
  <meta name="description" content="小日子記帳，輕鬆記下每一筆日常支出。">
  <title>小日子記帳</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #303b34;
      --muted: #8a938c;
      --green: #567963;
      --green-dark: #3e604b;
      --green-soft: #e7eee7;
      --paper: #f7f8f3;
      --white: #fff;
      --line: #e9ece5;
      --shadow: 0 12px 32px rgba(44, 63, 49, .055);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--sans);
      line-height: 1.6;
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid #9db9a2;
      outline-offset: 3px;
    }
    .app-shell { min-height: 100vh; }
    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(28px, calc((100% - 1220px) / 2));
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .86);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: var(--green-dark);
      background: var(--green-soft);
      font-size: 21px;
    }
    .brand-name { font-size: 18px; font-weight: 750; letter-spacing: .04em; }
    .brand-caption { margin-top: 1px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .today-label { color: var(--muted); font-size: 13px; }
    .page {
      width: min(1220px, calc(100% - 56px));
      margin: 0 auto;
      padding: 42px 0 64px;
    }
    .welcome {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
    }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); letter-spacing: .025em; }
    .welcome-note { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 22px;
    }
    .summary-card {
      position: relative;
      overflow: hidden;
      min-height: 148px;
      padding: 24px 26px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .summary-card.month { color: var(--white); border-color: var(--green); background: var(--green); }
    .summary-card.month::after {
      position: absolute;
      right: -25px;
      bottom: -82px;
      width: 190px;
      height: 190px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      box-shadow: 0 0 0 22px rgba(255,255,255,.045), 0 0 0 46px rgba(255,255,255,.035);
      content: "";
    }
    .summary-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .month .summary-label { color: rgba(255,255,255,.78); }
    .summary-icon { font-size: 16px; }
    .summary-value { margin-top: 12px; font-size: clamp(25px, 4vw, 34px); font-weight: 700; letter-spacing: .015em; }
    .summary-foot { margin-top: 1px; color: var(--muted); font-size: 12px; }
    .month .summary-foot { color: rgba(255,255,255,.75); }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); gap: 22px; align-items: start; }
    .left-column, .right-column { display: grid; gap: 22px; }
    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--white);
      box-shadow: var(--shadow);
    }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .panel-heading h2 { margin: 0; font-size: 17px; font-weight: 700; }
    .panel-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .count-badge { padding: 4px 10px; border-radius: 99px; color: var(--green-dark); background: var(--green-soft); font-size: 11px; }
    .expense-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; }
    .field { display: grid; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #68736b; font-size: 12px; font-weight: 600; }
    .field input, .field select {
      width: 100%;
      height: 43px;
      padding: 0 12px;
      border: 1px solid #e5e9e2;
      border-radius: 10px;
      color: var(--ink);
      background: #fcfdfa;
      font-size: 13px;
    }
    .field input::placeholder { color: #b2b9b3; }
    .field input:focus, .field select:focus { border-color: #9ab19d; outline: 3px solid rgba(86,121,99,.12); }
    .submit-button {
      width: 100%;
      min-height: 44px;
      grid-column: 1 / -1;
      margin-top: 3px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: var(--green);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background .18s ease, transform .18s ease;
    }
    .submit-button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .chart-list { display: grid; gap: 17px; }
    .chart-row { display: grid; gap: 7px; }
    .chart-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; }
    .chart-category { display: inline-flex; align-items: center; gap: 8px; color: #5d6860; }
    .chart-amount { color: var(--ink); font-weight: 650; }
    .chart-track { height: 8px; overflow: hidden; border-radius: 99px; background: #f0f2ed; }
    .chart-bar { height: 100%; min-width: 3px; border-radius: inherit; background: var(--bar-color, #78947d); transition: width .3s ease; }
    .chart-empty { padding: 24px 12px; color: var(--muted); font-size: 13px; text-align: center; }
    .expense-list { display: grid; }
    .expense-item {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto 34px;
      align-items: center;
      gap: 12px;
      min-height: 67px;
      border-top: 1px solid #f0f1ed;
    }
    .expense-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; background: #f2f5ef; font-size: 18px; }
    .expense-info { min-width: 0; }
    .expense-title { overflow: hidden; color: #3d4840; font-size: 13px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .expense-meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .expense-amount { color: #3d4840; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .delete-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 9px;
      color: #a4aca5;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
    }
    .delete-button:hover { color: #a24f4f; background: #fbefed; }
    .empty-state { padding: 28px 12px 14px; color: var(--muted); text-align: center; }
    .empty-state-icon { margin-bottom: 8px; font-size: 27px; }
    .empty-state p { margin: 0; font-size: 13px; }
    .list-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 13px; padding-top: 14px; border-top: 1px solid #f0f1ed; }
    .export-button {
      min-height: 37px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid #e5e9e2;
      border-radius: 9px;
      color: var(--green-dark);
      background: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .export-button:hover:not(:disabled) { background: #f4f7f2; border-color: #cbd8cc; }
    .export-button:disabled { color: #adb4ae; background: #f8f9f7; cursor: not-allowed; }
    .data-note { align-self: center; color: #a0a9a1; font-size: 10px; }
    .toast {
      position: fixed;
      z-index: 3;
      right: 24px;
      bottom: 24px;
      max-width: min(380px, calc(100vw - 32px));
      padding: 12px 16px;
      border-radius: 12px;
      color: #fff;
      background: #3f604b;
      box-shadow: 0 8px 26px rgba(35, 57, 41, .18);
      font-size: 13px;
    }
    .toast[hidden] { display: none; }
    @media (max-width: 860px) {
      .content-grid { grid-template-columns: minmax(0, 1fr) minmax(260px, .8fr); gap: 16px; }
      .left-column, .right-column { gap: 16px; }
      .panel { padding: 20px; }
      .expense-item { grid-template-columns: 38px minmax(0, 1fr) auto 30px; gap: 9px; }
      .expense-icon { width: 36px; height: 36px; }
    }
    @media (max-width: 680px) {
      .topbar { height: 68px; padding: 0 20px; }
      .today-label { font-size: 11px; }
      .page { width: calc(100% - 32px); padding: 30px 0 42px; }
      .welcome { align-items: start; margin-bottom: 20px; }
      .summary-grid { gap: 10px; margin-bottom: 16px; }
      .summary-card { min-height: 128px; padding: 17px; border-radius: 15px; }
      .summary-value { margin-top: 10px; font-size: clamp(21px, 6vw, 29px); }
      .content-grid { grid-template-columns: 1fr; gap: 16px; }
      .right-column { grid-row: 1; }
      .left-column { grid-row: 2; }
      .panel { padding: 20px; border-radius: 16px; }
      .expense-form { gap: 12px 10px; }
    }
    @media (max-width: 390px) {
      .brand-caption { display: none; }
      .today-label { max-width: 130px; text-align: right; }
      .summary-card { padding: 14px; }
      .summary-label { font-size: 11px; }
      .expense-item { grid-template-columns: 34px minmax(0,1fr) auto 28px; gap: 7px; }
      .expense-icon { width: 32px; height: 32px; }
      .expense-amount { font-size: 12px; }
      .data-note { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✿</div>
        <div>
          <div class="brand-name">小日子記帳</div>
          <div class="brand-caption">把日常，慢慢記下來</div>
        </div>
      </div>
      <time class="today-label" id="today-label"></time>
    </header>

    <main class="page">
      <section class="welcome" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">MY LITTLE LEDGER</p>
          <h1 id="page-title">今天也好好生活 ☁️</h1>
          <p class="welcome-note">每一筆日常，都是照顧自己的小練習。</p>
        </div>
      </section>

      <section class="summary-grid" aria-label="支出摘要">
        <article class="summary-card">
          <div class="summary-label"><span class="summary-icon" aria-hidden="true">◷</span>累積總支出</div>
          <div class="summary-value" id="total-expense">$0</div>
          <div class="summary-foot">所有已記錄的日常支出</div>
        </article>
        <article class="summary-card month">
          <div class="summary-label"><span class="summary-icon" aria-hidden="true">✳</span>本月支出</div>
          <div class="summary-value" id="month-expense">$0</div>
          <div class="summary-foot" id="month-caption">本月的每一份小日常</div>
        </article>
      </section>

      <div class="content-grid">
        <div class="left-column">
          <section class="panel" aria-labelledby="add-title">
            <div class="panel-heading">
              <div>
                <h2 id="add-title">記下一筆</h2>
                <p class="panel-subtitle">替今天的生活留一個小記錄</p>
              </div>
              <span class="count-badge">新增支出</span>
            </div>
            <form class="expense-form" id="expense-form">
              <div class="field">
                <label for="expense-date">消費日期</label>
                <input id="expense-date" name="date" type="date" required>
              </div>
              <div class="field">
                <label for="expense-category">分類</label>
                <select id="expense-category" name="category" required>
                  <option value="餐飲">🍜 餐飲</option>
                  <option value="交通">🚇 交通</option>
                  <option value="購物">🛍️ 購物</option>
                  <option value="居家">🏠 居家</option>
                  <option value="娛樂">🎬 娛樂</option>
                  <option value="醫療">🌿 醫療</option>
                  <option value="學習">📚 學習</option>
                  <option value="其他">✨ 其他</option>
                </select>
              </div>
              <div class="field full">
                <label for="expense-title">消費項目</label>
                <input id="expense-title" name="title" type="text" maxlength="60" placeholder="例如：午餐、咖啡、日用品" required>
              </div>
              <div class="field full">
                <label for="expense-amount">金額</label>
                <input id="expense-amount" name="amount" type="number" min="1" max="999999999" step="1" inputmode="numeric" placeholder="輸入新台幣金額" required>
              </div>
              <button class="submit-button" type="submit">＋　新增這筆支出</button>
            </form>
          </section>

          <section class="panel" aria-labelledby="records-title">
            <div class="panel-heading">
              <div>
                <h2 id="records-title">最近的日常</h2>
                <p class="panel-subtitle">依消費日期，從新到舊排列</p>
              </div>
              <span class="count-badge" id="record-count">0 筆</span>
            </div>
            <div class="expense-list" id="expense-list" aria-live="polite"></div>
            <div class="list-footer">
              <span class="data-note">紀錄保存在這台裝置的瀏覽器中</span>
              <button class="export-button" id="export-button" type="button" disabled>
                <span aria-hidden="true">↓</span> 匯出 CSV
              </button>
            </div>
          </section>
        </div>

        <aside class="right-column">
          <section class="panel" aria-labelledby="chart-title">
            <div class="panel-heading">
              <div>
                <h2 id="chart-title">本月分類支出</h2>
                <p class="panel-subtitle">看看這個月的花費去了哪裡</p>
              </div>
              <span aria-hidden="true">▥</span>
            </div>
            <div class="chart-list" id="category-chart" aria-live="polite"></div>
          </section>
          <section class="panel" aria-label="記帳小提醒">
            <div class="panel-heading" style="margin-bottom: 8px">
              <h2>給自己的小提醒</h2>
              <span aria-hidden="true">🌱</span>
            </div>
            <p class="panel-subtitle" style="font-size:13px;line-height:1.8">記帳不是限制，而是更溫柔地了解自己的生活。每天一點點，就很棒了。</p>
          </section>
        </aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const STORAGE_KEY = "little-days-expenses-v1";
    const categoryDetails = {
      餐飲: { icon: "🍜", color: "#88a58b" },
      交通: { icon: "🚇", color: "#8da9bb" },
      購物: { icon: "🛍️", color: "#c89b83" },
      居家: { icon: "🏠", color: "#a99ab9" },
      娛樂: { icon: "🎬", color: "#d1ad6e" },
      醫療: { icon: "🌿", color: "#81a99b" },
      學習: { icon: "📚", color: "#8295ba" },
      其他: { icon: "✨", color: "#aaa99a" }
    };

    const form = document.querySelector("#expense-form");
    const list = document.querySelector("#expense-list");
    const chart = document.querySelector("#category-chart");
    const toast = document.querySelector("#toast");
    let toastTimer;
    let expenses = loadExpenses();

    function loadExpenses() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return [];
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) throw new Error("記帳資料格式不正確。");
        return parsed.filter((item) =>
          item &&
          typeof item.id === "string" &&
          typeof item.date === "string" &&
          typeof item.title === "string" &&
          typeof item.category === "string" &&
          Number.isSafeInteger(item.amount) &&
          item.amount > 0
        );
      } catch (error) {
        console.error("讀取記帳資料失敗：", error);
        showToast("讀取紀錄失敗，請確認瀏覽器儲存空間是否可用。");
        return [];
      }
    }

    function saveExpenses() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
        return true;
      } catch (error) {
        console.error("儲存記帳資料失敗：", error);
        showToast("無法儲存紀錄，請確認瀏覽器儲存空間是否足夠。");
        return false;
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.hidden = false;
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => { toast.hidden = true; }, 3200);
    }

    function formatCurrency(amount) {
      return "$" + new Intl.NumberFormat("zh-TW").format(amount);
    }

    function formatDate(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      return `${year}/${String(month).padStart(2, "0")}/${String(day).padStart(2, "0")}`;
    }

    function currentMonthExpenses() {
      const now = new Date();
      const prefix = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      return expenses.filter((item) => item.date.startsWith(prefix));
    }

    function renderSummary() {
      const total = expenses.reduce((sum, item) => sum + item.amount, 0);
      const monthTotal = currentMonthExpenses().reduce((sum, item) => sum + item.amount, 0);
      document.querySelector("#total-expense").textContent = formatCurrency(total);
      document.querySelector("#month-expense").textContent = formatCurrency(monthTotal);
      document.querySelector("#record-count").textContent = `${expenses.length} 筆`;
      document.querySelector("#export-button").disabled = expenses.length === 0;
    }

    function renderList() {
      const sorted = [...expenses].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
      if (sorted.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon" aria-hidden="true">🌼</div><p>還沒有記帳紀錄，從今天的第一筆開始吧。</p></div>';
        return;
      }
      list.replaceChildren(...sorted.map((item) => {
        const details = categoryDetails[item.category] || categoryDetails["其他"];
        const row = document.createElement("article");
        row.className = "expense-item";
        const icon = document.createElement("span");
        icon.className = "expense-icon";
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = details.icon;
        const info = document.createElement("div");
        info.className = "expense-info";
        const title = document.createElement("div");
        title.className = "expense-title";
        title.textContent = item.title;
        const meta = document.createElement("div");
        meta.className = "expense-meta";
        meta.textContent = `${item.category} ・ ${formatDate(item.date)}`;
        info.append(title, meta);
        const amount = document.createElement("span");
        amount.className = "expense-amount";
        amount.textContent = formatCurrency(item.amount);
        const remove = document.createElement("button");
        remove.className = "delete-button";
        remove.type = "button";
        remove.dataset.id = item.id;
        remove.setAttribute("aria-label", `刪除${item.title}，${formatCurrency(item.amount)}`);
        remove.title = "刪除這筆紀錄";
        remove.textContent = "×";
        row.append(icon, info, amount, remove);
        return row;
      }));
    }

    function renderChart() {
      const totals = new Map();
      currentMonthExpenses().forEach((item) => {
        totals.set(item.category, (totals.get(item.category) || 0) + item.amount);
      });
      const categories = [...totals.entries()].sort((a, b) => b[1] - a[1]);
      if (categories.length === 0) {
        chart.innerHTML = '<div class="chart-empty">本月還沒有支出紀錄<br>新增一筆後就會顯示在這裡 ✨</div>';
        return;
      }
      const max = categories[0][1];
      chart.replaceChildren(...categories.map(([name, amount]) => {
        const details = categoryDetails[name] || categoryDetails["其他"];
        const row = document.createElement("div");
        row.className = "chart-row";
        const label = document.createElement("div");
        label.className = "chart-label";
        const category = document.createElement("span");
        category.className = "chart-category";
        category.textContent = `${details.icon} ${name}`;
        const value = document.createElement("span");
        value.className = "chart-amount";
        value.textContent = formatCurrency(amount);
        label.append(category, value);
        const track = document.createElement("div");
        track.className = "chart-track";
        track.setAttribute("role", "img");
        track.setAttribute("aria-label", `${name}支出 ${formatCurrency(amount)}`);
        const bar = document.createElement("div");
        bar.className = "chart-bar";
        bar.style.width = `${Math.max(4, amount / max * 100)}%`;
        bar.style.setProperty("--bar-color", details.color);
        track.append(bar);
        row.append(label, track);
        return row;
      }));
    }

    function render() {
      renderSummary();
      renderList();
      renderChart();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      const formData = new FormData(form);
      const title = String(formData.get("title")).trim();
      const amount = Number(formData.get("amount"));
      const date = String(formData.get("date"));
      const category = String(formData.get("category"));
      if (!title || !Number.isSafeInteger(amount) || amount <= 0 || !categoryDetails[category] || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        showToast("請確認日期、項目與金額都填寫正確。");
        return;
      }
      expenses.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, date, title, category, amount });
      const saved = saveExpenses();
      render();
      form.reset();
      document.querySelector("#expense-date").value = getLocalDate();
      document.querySelector("#expense-title").focus();
      if (saved) showToast("這筆日常已經記下來了 🌿");
    });

    list.addEventListener("click", (event) => {
      const button = event.target.closest(".delete-button");
      if (!button) return;
      expenses = expenses.filter((item) => item.id !== button.dataset.id);
      const saved = saveExpenses();
      render();
      if (saved) showToast("已刪除這筆紀錄。");
    });

    document.querySelector("#export-button").addEventListener("click", () => {
      if (expenses.length === 0) return;
      const quote = (value) => `"${String(value).replace(/"/g, '""')}"`;
      const rows = [
        ["消費日期", "消費項目", "分類", "金額"],
        ...[...expenses].sort((a, b) => a.date.localeCompare(b.date)).map((item) => [
          item.date, item.title, item.category, item.amount
        ])
      ];
      const csv = "\uFEFF" + rows.map((row) => row.map(quote).join(",")).join("\r\n");
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = `小日子記帳_${getLocalDate()}.csv`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("CSV 消費資料已匯出。");
    });

    function getLocalDate() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offset).toISOString().slice(0, 10);
    }

    const now = new Date();
    document.querySelector("#today-label").textContent = new Intl.DateTimeFormat("zh-TW", {
      year: "numeric", month: "long", day: "numeric", weekday: "long"
    }).format(now);
    document.querySelector("#month-caption").textContent = `${now.getFullYear()} 年 ${now.getMonth() + 1} 月的每一份小日常`;
    document.querySelector("#expense-date").value = getLocalDate();
    render();
  </script>
</body>
</html>
